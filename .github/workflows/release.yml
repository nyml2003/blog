name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install workspace dependencies
        run: nix develop ./nix -c pnpm install --frozen-lockfile
      - name: Package x86_64
        run: nix develop ./nix -c ops delivery package --target x86_64-unknown-linux-musl
      - name: Package aarch64
        run: nix develop ./nix -c ops delivery package --target aarch64-unknown-linux-musl
      - name: Smoke-test install rendering
        run: |
          workdir="$(mktemp -d)"
          tar -xzf deploy/dist/blog-release-x86_64-unknown-linux-musl-*.tar.gz -C "$workdir"
          (cd "$workdir" && SERVER_NAME=example.com CONTENT_REPO=owner/blog-content RENDER_ONLY=1 bash install.sh)
      - uses: actions/upload-artifact@v4
        with:
          name: blog-release
          path: deploy/dist/blog-release-*.tar.gz
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/dist/blog-release-*.tar.gz
