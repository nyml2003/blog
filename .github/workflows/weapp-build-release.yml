name: weapp-build-release

on:
  push:
    tags: ['weapp-test-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      environment:
        description: test or production when manually dispatched
        required: true
        type: choice
        options: [test, production]
      api_origin:
        description: API origin for production builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: cachix/install-nix-action@v27
      - name: Install workspace dependencies
        run: nix develop ./nix -c pnpm install --frozen-lockfile
      - name: Build WeChat mini-program
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          nix develop ./nix -c pnpm exec tsc --noEmit -p apps/weapp/tsconfig.json
          if [[ "$GITHUB_REF_NAME" == weapp-test-v* ]]; then
            environment=test
          else
            environment="$RELEASE_ENVIRONMENT"
          fi
          if [[ "$environment" == production ]]; then api_origin="$RELEASE_API_ORIGIN"; test -n "$api_origin"; else api_origin=http://127.0.0.1:8080; fi
          nix develop ./nix -c ops weapp build --environment "$environment" --api-origin "$api_origin"
      - name: Package WeChat mini-program
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" == weapp-test-v* ]]; then
            environment=test
            version="${GITHUB_REF_NAME#weapp-test-v}"
          else
            environment="$RELEASE_ENVIRONMENT"
            version="$RELEASE_VERSION"
          fi
          archive="deploy/dist/blog-weapp-${environment}-${version}.tar.gz"
          mkdir -p deploy/dist
          tar -czf "$archive" -C target weapp
          sha256sum "$archive" > "${archive}.sha256"
          test -s "$archive"
          tar -tzf "$archive" | grep -Eq '^weapp/app\.json$'
          tar -tzf "$archive" | grep -Eq '^weapp/lib/runtime\.js$'
      - uses: actions/upload-artifact@v4
        with:
          name: blog-weapp-${{ github.ref_name }}
          path: |
            deploy/dist/blog-weapp-*.tar.gz
            deploy/dist/blog-weapp-*.tar.gz.sha256
      - name: Publish WeChat mini-program release asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.environment == 'production'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('weapp-v{0}', inputs.version) }}
          files: |
            deploy/dist/blog-weapp-*.tar.gz
            deploy/dist/blog-weapp-*.tar.gz.sha256
