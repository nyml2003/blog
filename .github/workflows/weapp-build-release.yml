name: weapp-build-release

on:
  push:
    tags: ['weapp-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: cachix/install-nix-action@v27
      - name: Install workspace dependencies
        run: nix develop ./nix -c pnpm install --frozen-lockfile
      - name: Build WeChat mini-program
        run: |
          nix develop ./nix -c pnpm exec tsc --noEmit -p apps/weapp/tsconfig.script.json
          nix develop ./nix -c node apps/weapp/build.mjs --api-origin http://127.0.0.1:8080
      - name: Package WeChat mini-program
        run: |
          if [[ "$GITHUB_REF_NAME" == weapp-v* ]]; then
            version="${GITHUB_REF_NAME#weapp-v}"
          else
            version="${{ inputs.version }}"
          fi
          archive="deploy/dist/blog-weapp-${version}.tar.gz"
          mkdir -p deploy/dist
          tar -czf "$archive" -C target weapp
          sha256sum "$archive" > "${archive}.sha256"
          test -s "$archive"
          tar -tzf "$archive" | grep -Eq '^weapp/app\.json$'
          tar -tzf "$archive" | grep -Eq '^weapp/lib/runtime\.js$'
          test -s target/weapp-script.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: blog-weapp-${{ github.ref_name }}
          path: |
            deploy/dist/blog-weapp-*.tar.gz
            deploy/dist/blog-weapp-*.tar.gz.sha256
            target/weapp-script.mjs
      - name: Publish WeChat mini-program release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/dist/blog-weapp-*.tar.gz
            deploy/dist/blog-weapp-*.tar.gz.sha256
            target/weapp-script.mjs
