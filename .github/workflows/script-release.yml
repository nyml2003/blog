name: script-release

on:
  push:
    tags: ['script-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    env:
      OPS_RUNTIME_E2E: ''
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Install workspace dependencies
        run: nix develop ./nix -c pnpm install --frozen-lockfile
      - name: Build installer bundle
        run: nix develop ./nix -c ops delivery installer
      - name: Validate installer bundle
        run: |
          test -s deploy/dist/blog-deploy.mjs
          node deploy/dist/blog-deploy.mjs --help >/dev/null
          printf '%s  %s\n' "$(sha256sum deploy/dist/blog-deploy.mjs | cut -d' ' -f1)" blog-deploy.mjs > SHA256SUMS
          test "${GITHUB_REF_NAME#script-v}" = "$(node -p "require('./apps/blog-deploy/package.json').version")"
      - uses: actions/upload-artifact@v4
        with:
          name: blog-deploy-mjs
          path: |
            deploy/dist/blog-deploy.mjs
            SHA256SUMS
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/dist/blog-deploy.mjs
            SHA256SUMS
