[package]
name = "data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Data Server：SQLite/夹具数据、typed operations、同步线程池与背压"

[[bin]]
name = "data"
path = "src/main.rs"

[dependencies]
protocol = { path = "../../core/protocol" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
# 集成测试需要临时目录与进程断言（无网络/HTTP client 依赖，测试内直连 127.0.0.1）。
tempfile = "3"
