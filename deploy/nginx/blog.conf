server {
    listen 80;
    server_name {{serverName}} {{apexName}};
    return 301 https://{{serverName}}$request_uri;
}

server {
    listen 443 ssl;
    server_name {{serverName}};
    ssl_certificate     /etc/nginx/cert/{{serverName}}.pem;
    ssl_certificate_key /etc/nginx/cert/{{serverName}}.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 公网只读:管理面在 Product(--admin off)已是 404,这里再加一层兜底
    location /admin { return 404; }
    location /api/admin/ { return 404; }

    # 页面与 /api 同源,均由 Product(127.0.0.1:17800)提供
    location / {
        proxy_pass http://127.0.0.1:17800;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
